<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
</head>
<body>
    <div id="messages"></div>
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        // const ws = new WebSocket('wss://critical-donella-egeniestores2-12e8ec2b.koyeb.app/ws');
        const ws = new WebSocket('ws://127.0.0.1:8000/ws');

    function formatTextResponse(response) {
        // Replace double **text** with <strong>text</strong> for bold styling
        let formattedText = response.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        
        // Replace URLs with clickable "Check Product" links
        formattedText = formattedText.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">Check Product</a>');
        
        // Replace line breaks with <br> for HTML rendering
        formattedText = formattedText.replace(/\n/g, "<br>");
        
        return formattedText;
    }





        

        ws.onmessage = function(event) {
            const messages = document.getElementById('messages');
            const message = document.createElement('div');
            // console.log(event)
            const botMessage = formatTextResponse(event.data)
            message.innerHTML = 'Bot: ' + botMessage;
            messages.appendChild(message);
        };

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value;
            ws.send(message);

            const messages = document.getElementById('messages');
            const userMessage = document.createElement('div');
            userMessage.textContent = 'You: ' + message;
            messages.appendChild(userMessage);

            input.value = '';
        }
    </script>
</body>
</html>
