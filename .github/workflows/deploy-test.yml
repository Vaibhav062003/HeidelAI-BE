name: Deploy Test Branch to Northflank

on:
  push:
    branches:
      - test

env:
  PROJECT_ID: your-northflank-project-id      # e.g. "heidelai-dev"
  SERVICE_ID: your-northflank-service-id      # e.g. "heidelai-backend"
  CREDENTIALS_ID: testingheidelai docker   
  
jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_TEST }}
          password: ${{ secrets.DOCKER_PASSWORD_TEST }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME_TEST }}/backend:test
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME_TEST }}/backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME_TEST }}/backend:buildcache,mode=max

      - name: Deploy to Northflank
        uses: northflank/deploy-to-northflank@v1
        with:
          northflank-api-key: ${{ secrets.NORTHFLANK_API_KEY }}
          project-id: ${{ env.PROJECT_ID }}
          service-id: ${{ env.SERVICE_ID }}
          image-path: ${{ secrets.DOCKER_USERNAME_TEST }}/backend:test
          credentials-id: ${{ env.CREDENTIALS_ID }}