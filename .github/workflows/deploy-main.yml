name: Deploy Main Branch to Koyeb

# TRIGGER: This runs when code is pushed (or PR is merged) to 'main'
on:
  push:
    branches:
      - main

jobs:
  deploy-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_PROD }}
          password: ${{ secrets.DOCKER_PASSWORD_PROD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and tag specifically for MAIN
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Using ':main' tag to keep it separate from production images
          tags: ${{ secrets.DOCKER_USERNAME_PROD }}/backend:test
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME_PROD }}/backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME_PROD }}/backend:buildcache,mode=max

      # Redeploy the MAIN service on Koyeb
      - name: Install Koyeb CLI
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_TOKEN_PROD }}

      - name: Redeploy Koyeb Instance
        run: koyeb service redeploy backend/backend