name: Deploy Main Branch to Koyeb

# TRIGGER: This runs when code is pushed (or PR is merged) to 'main'
on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/backend-checks.yml

  deploy-main:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_PROD }}
          password: ${{ secrets.DOCKER_PASSWORD_PROD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and tag specifically for MAIN
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKER_USERNAME_PROD }}/backend:test
            ${{ secrets.DOCKER_USERNAME_PROD }}/backend:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME_PROD }}/backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME_PROD }}/backend:buildcache,mode=max

      - name: Install Koyeb CLI
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_TOKEN_PROD }}

      - name: Deploy exact image to Koyeb
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME_PROD }}/backend:sha-${{ github.sha }}
        run: koyeb service update backend/backend --docker "$IMAGE" --wait --wait-timeout 15m

      - name: Verify API health
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          curl --fail --retry 30 --retry-delay 10 --retry-all-errors --output health.json https://api.heidelai.com/health
          jq -e --arg revision "$EXPECTED_REVISION" '.status == "ok" and .revision == $revision' health.json
