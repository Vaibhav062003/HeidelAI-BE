name: Migrate production WhatsApp organization

on:
  workflow_dispatch:
    inputs:
      org_id:
        description: Organization ID to validate and migrate
        required: true
        type: string
      apply:
        description: Apply the migration after a successful dry run
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type APPLY when apply is enabled
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: migrate-whatsapp-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_TOKEN_PROD }}

      - name: Validate input
        env:
          ORG_ID: ${{ inputs.org_id }}
          APPLY: ${{ inputs.apply }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$ORG_ID" =~ ^org_[A-Za-z0-9]+$ ]]
          if [[ "$APPLY" == "true" ]]; then
            [[ "$CONFIRMATION" == "APPLY" ]]
          fi

      - name: Dry run
        env:
          ORG_ID: ${{ inputs.org_id }}
        run: koyeb services exec backend/backend python -- -m scripts.migrate_multi_whatsapp --org-id "$ORG_ID"

      - name: Apply
        if: ${{ inputs.apply }}
        env:
          ORG_ID: ${{ inputs.org_id }}
        run: koyeb services exec backend/backend python -- -m scripts.migrate_multi_whatsapp --org-id "$ORG_ID" --apply
