name: Deploy Dev Branch to Koyeb

# TRIGGER: This runs when code is pushed (or PR is merged) to 'dev'
on:
  push:
    branches:
      - dev

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and tag specifically for DEV
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Using ':dev' tag to keep it separate from production images
          tags: ${{ secrets.DOCKER_USERNAME }}/heidelai-dev:test
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/backend:buildcache,mode=max

      # Redeploy the DEV service on Koyeb
      - name: Install Koyeb CLI
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_TOKEN }}

      - name: Redeploy Koyeb Instance
        # Replace 'heidelai-backend-dev' with your actual DEV service name
        run: koyeb service redeploy heidelai-dev/heidelai-dev