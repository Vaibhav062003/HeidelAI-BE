name: Deploy Dev Branch to Koyeb

# TRIGGER: This runs when code is pushed (or PR is merged) to 'dev'
on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/backend-checks.yml

  deploy-dev:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and tag specifically for DEV
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/heidelai-dev:test
            ${{ secrets.DOCKER_USERNAME }}/heidelai-dev:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/backend:buildcache,mode=max

      # Redeploy the DEV service on Koyeb
      - name: Install Koyeb CLI
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_TOKEN }}

      - name: Deploy exact image to Koyeb
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/heidelai-dev:sha-${{ github.sha }}
        run: koyeb service update heidelai-dev/heidelai-dev --docker "$IMAGE" --wait --wait-timeout 15m

      - name: Verify API readiness
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          curl --fail --retry 30 --retry-delay 10 --retry-all-errors --output readiness.json https://heidelai-dev.koyeb.app/ready
          jq -e --arg revision "$EXPECTED_REVISION" '.status == "ready" and .revision == $revision' readiness.json
